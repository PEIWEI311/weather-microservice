server.port={cipher}
spring.application.name=details

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Actuator config
management.endpoints.web.exposure.include=*,prometheus,health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.endpoints.web.base-path=/actuator

spring.mvc.contentnegotiation.favor-parameter=true
spring.mvc.contentnegotiation.media-types.prometheus=application/openmetrics-text
spring.mvc.contentnegotiation.media-types.txt=text/plain

#indicates the frequency the client sends heartbeat to server to indicate that it is alive.
eureka.instance.lease-renewal-interval-in-seconds=10

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# OpenAPI Configuration - Simplified
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.disable-swagger-default-url=true

springdoc.swagger-ui.configUrl=/swagger-ui/swagger-config.json
springdoc.pathsToMatch=/**


