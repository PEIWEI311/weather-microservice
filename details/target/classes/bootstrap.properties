spring.application.name=details
server.port=9400
spring.profiles.active=dev
spring.cloud.config.uri=http://localhost:8100
spring.main.allow-bean-definition-overriding=true

management.endpoints.web.exposure.include=*
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true



spring.mvc.contentnegotiation.media-types.prometheus=application/openmetrics-text
spring.mvc.contentnegotiation.media-types.openmetrics=application/openmetrics-text
spring.mvc.contentnegotiation.media-types.text=text/plain


management.endpoints.web.produces=application/json,application/openmetrics-text,text/plain,*/*


logging.level.org.springframework.web=DEBUG