server.port=8200



# Search combined route
spring.cloud.gateway.routes[0].id=search
spring.cloud.gateway.routes[0].uri=lb://search
spring.cloud.gateway.routes[0].predicates[0]=Path=/search/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

# Details module route - Add StripPrefix filter
spring.cloud.gateway.routes[1].id=detailsModule
spring.cloud.gateway.routes[1].uri=lb://details
spring.cloud.gateway.routes[1].predicates[0]=Path=/details/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

# Dataservice route - Add StripPrefix filter
spring.cloud.gateway.routes[2].id=dataservice
spring.cloud.gateway.routes[2].uri=lb://dataservice
spring.cloud.gateway.routes[2].predicates[0]=Path=/dataservice/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

# Swagger UI route
spring.cloud.gateway.routes[3].id=swagger-ui-route
spring.cloud.gateway.routes[3].uri=lb://gateway
spring.cloud.gateway.routes[3].predicates[0]=Path=/swagger-ui/**,/v3/api-docs/**,/swagger-ui.html
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/swagger-resources(?<segment>/?.*), /swagger-resources$\{segment}

# Search API Docs route
spring.cloud.gateway.routes[4].id=search-api-docs
spring.cloud.gateway.routes[4].uri=lb://search
spring.cloud.gateway.routes[4].predicates[0]=Path=/search/v3/api-docs/**
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/search/v3/api-docs(?<segment>/?.*), /v3/api-docs$\{segment}

# Details API Docs route
spring.cloud.gateway.routes[5].id=details-api-docs
spring.cloud.gateway.routes[5].uri=lb://details
spring.cloud.gateway.routes[5].predicates[0]=Path=/details/v3/api-docs/**
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/details/v3/api-docs(?<segment>/?.*), /v3/api-docs$\{segment}

# Dataservice API Docs route
spring.cloud.gateway.routes[6].id=dataservice-api-docs
spring.cloud.gateway.routes[6].uri=lb://dataservice
spring.cloud.gateway.routes[6].predicates[0]=Path=/dataservice/v3/api-docs/**
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/dataservice/v3/api-docs(?<segment>/?.*), /v3/api-docs$\{segment}

spring.cloud.gateway.discovery.locator.enabled=true
myservice.ribbon.NFLoadBalancerRuleClassName=com.netflix.loadbalancer.RandomRule

#eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# gateway actuator
management.endpoints.web.exposure.include=*,prometheus,health,info,metrics
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true


eureka.instance.lease-renewal-interval-in-seconds=10
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/