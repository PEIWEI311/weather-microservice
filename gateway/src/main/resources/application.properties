# API Documentation routes - 扩展路径匹配
spring.cloud.gateway.routes[100].id=swagger-ui
spring.cloud.gateway.routes[100].uri=http://localhost:${server.port}
spring.cloud.gateway.routes[100].predicates[0]=Path=/swagger-ui.html,/swagger-ui/**,/webjars/**
spring.cloud.gateway.routes[100].order=-1

# 添加各微服务API文档路由
# Search API Docs route
spring.cloud.gateway.routes[101].id=search-api-docs
spring.cloud.gateway.routes[101].uri=lb://search
spring.cloud.gateway.routes[101].predicates[0]=Path=/search/v3/api-docs/**,/search/swagger-ui/swagger-config.json
spring.cloud.gateway.routes[101].filters[0]=RewritePath=/search/(?<segment>.*), /$\{segment}

# Details API Docs route
spring.cloud.gateway.routes[102].id=details-api-docs
spring.cloud.gateway.routes[102].uri=lb://details
spring.cloud.gateway.routes[102].predicates[0]=Path=/details/v3/api-docs/**,/details/swagger-ui/swagger-config.json
spring.cloud.gateway.routes[102].filters[0]=RewritePath=/details/(?<segment>.*), /$\{segment}

# Dataservice API Docs route
spring.cloud.gateway.routes[103].id=dataservice-api-docs
spring.cloud.gateway.routes[103].uri=lb://dataservice
spring.cloud.gateway.routes[103].predicates[0]=Path=/dataservice/v3/api-docs/**,/dataservice/swagger-ui/swagger-config.json
spring.cloud.gateway.routes[103].filters[0]=RewritePath=/dataservice/(?<segment>.*), /$\{segment}

# OpenAPI Documentation Configuration
springdoc.swagger-ui.urls[0].name=Search Service
springdoc.swagger-ui.urls[0].url=/search/v3/api-docs
springdoc.swagger-ui.urls[1].name=Details Service
springdoc.swagger-ui.urls[1].url=/details/v3/api-docs
springdoc.swagger-ui.urls[2].name=Data Service
springdoc.swagger-ui.urls[2].url=/dataservice/v3/api-docs

# Swagger UI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.configUrl=/swagger-ui/swagger-config
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.operationsSorter=alpha



