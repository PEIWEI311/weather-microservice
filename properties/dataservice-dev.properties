server.port={cipher}
# Hikari config
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.idle-timeout=300000

# MongoDB config
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=student_db
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.authentication-database=admin
spring.data.mongodb.field-naming-strategy=org.springframework.data.mapping.model.SnakeCaseFieldNamingStrategy
spring.data.mongodb.uuid-representation=standard
spring.data.mongodb.write-concern=ACKNOWLEDGED
spring.data.mongodb.read-preference=primary

spring.data.mongodb.username={cipher}

spring.data.mongodb.password={cipher}

# spring.data.mongodb.username=testuser
# spring.data.mongodb.password=testpassword
# Eureka config
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Actuator config
management.endpoints.web.exposure.include=*,prometheus,health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Add application name tag to metrics
spring.application.name= dataservice

#Hystrix config
hystrix.command.default.execution.isolation.thread.timeoutInMilliseconds=5000

# OpenAPI Configuration - Simplified
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.disable-swagger-default-url=true

# Correct path mapping for access through gateway
springdoc.swagger-ui.configUrl=/swagger-ui/swagger-config.json
springdoc.swagger-ui.url=/v3/api-docs
springdoc.pathsToMatch=/**